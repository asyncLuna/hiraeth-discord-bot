spring:
  application:
    name: hiraeth-discord-bot
  mongodb:
    uri: ${SPRING_MONGODB_URI:}
  main:
    banner-mode: OFF
  data:
    mongodb:
      auto-index-creation: true

sentry:
  dsn: ${SENTRY_DSN:}
  debug: false
  send-default-pii: ${SENTRY_SEND_DEFAULT_PII:false}
  max-breadcrumbs: 200
  traces-sample-rate: 0.1
  profile-session-sample-rate: 0.01
  enable-backpressure-handling: true
  logging:
    minimum-event-level: WARN
    minimum-breadcrumb-level: INFO
  logs:
    enabled: ${SENTRY_LOGS_ENABLED:true}
  enable-spotlight: false

discord:
  bot:
    token: ${DISCORD_BOT_TOKEN:}

hiraeth:
  member-of-the-week:
    guild-id: "1520153947644493905"
    channel-id: "1526320737059737781"
    log-channel-id: "1526324522909696264"
    role-id: "1526317499862356018"
    timezone: "Europe/Warsaw"
    cron: "0 0/5 * ? * *"
